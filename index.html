<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Check-up do Homem do CS São Raimundo: responda perguntas rápidas e veja o que cuidar na sua idade.">
<title>Check-up do Homem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: uma pergunta por tela, botões grandes de toque; resultado com faixa de cor (vermelho / amarelo / verde) e lista curta */
:root {
  --paper: #F3F6FA;
  --surface: #FFFFFF;
  --ink: #102338;
  --muted: #51637A;
  --line: #D0DAE6;
  --azul: #1D5BA6;
  --azul-ink: #FFFFFF;
  --zap: #1E7A4E;
  --red: #B42318;   --red-soft: #FDECEA;
  --amber: #A15C07; --amber-soft: #FDF1DC;
  --green: #1E7A4E; --green-soft: #E3F4EA;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1624; --surface: #13233A; --ink: #E6EEF8; --muted: #A3B5CB; --line: #2A3F58;
    --azul: #8DBBF2; --azul-ink: #0B1624; --zap: #2E9A66;
    --red: #F4877C; --red-soft: #3A1715; --amber: #F2B35E; --amber-soft: #36260F; --green: #6FD3A2; --green-soft: #12301F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B1624; --surface: #13233A; --ink: #E6EEF8; --muted: #A3B5CB; --line: #2A3F58;
  --azul: #8DBBF2; --azul-ink: #0B1624; --zap: #2E9A66;
  --red: #F4877C; --red-soft: #3A1715; --amber: #F2B35E; --amber-soft: #36260F; --green: #6FD3A2; --green-soft: #12301F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 19px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.tag { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--azul); }
h1 { font-size: 38px; font-stretch: 80%; font-weight: 800; line-height: 1.02; }
h2 { font-size: 30px; font-stretch: 84%; font-weight: 800; line-height: 1.1; }
.lead { color: var(--muted); }

.btns { display: flex; flex-direction: column; gap: 12px; }
.btn {
  font: inherit; cursor: pointer; text-align: left;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); border-radius: 16px; padding: 18px 20px;
  font-family: var(--f-display); font-stretch: 90%; font-weight: 800; font-size: 26px; line-height: 1.1;
}
.btn:active { border-color: var(--azul); }
.btn.main { background: var(--azul); color: var(--azul-ink); border-color: var(--azul); justify-content: center; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row .btn { justify-content: center; }
.btn.alt { font-size: 20px; justify-content: center; }

.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.on { background: var(--azul); }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link { font: inherit; font-weight: 700; color: var(--azul); background: none; border: 0; padding: 6px 0; cursor: pointer; }
.count { font-size: 15px; color: var(--muted); }
.signs { list-style: none; margin: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.signs li { padding-left: 20px; position: relative; }
.signs li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

.result { border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.result.red { background: var(--red-soft); }
.result.amber { background: var(--amber-soft); }
.result.green { background: var(--green-soft); }
.result .pill { align-self: flex-start; font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; color: var(--paper); }
.result.red .pill { background: var(--red); }
.result.amber .pill { background: var(--amber); }
.result.green .pill { background: var(--green); }
.result h2 { font-size: 32px; }

.todo h3 { font-family: var(--f-display); font-stretch: 90%; font-weight: 800; font-size: 20px; margin: 0 0 8px; }
.todo ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.todo li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 44px; position: relative; }
.todo li::before { content: "✓"; position: absolute; left: 14px; top: 11px; font-weight: 700; color: var(--azul); }

.zap { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--zap); color: #fff; text-decoration: none; border-radius: 16px; padding: 18px; font-family: var(--f-display); font-stretch: 90%; font-weight: 800; font-size: 22px; text-align: center; }
.zap svg { width: 26px; height: 26px; fill: #fff; flex: none; }
.small { font-size: 15px; color: var(--muted); text-align: center; }

h1:focus, h2:focus { outline: none; }
.btn:focus-visible, .link:focus-visible, .zap:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.4.1.1.1.7-.1 1.3z"/></symbol>
</svg>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
(function () {
  var SINAIS = ["Xixi difícil, demorado ou com jato fraco", "Levanta muitas vezes à noite para urinar", "Sangue no xixi", "Ferida no pênis ou na boca que não sara", "Caroço ou inchaço no testículo"];

  // Cada pergunta: texto, opções, e o cuidado que entra na lista quando a resposta pede atenção.
  var Q = {
    "20-29": [
      { t: "Fez teste de HIV e sífilis no último ano?", need: "nao", item: "Fazer teste rápido de HIV, sífilis e hepatites. Resultado em cerca de 30 minutos." },
      { t: "Às vezes transa sem camisinha?", need: "sim", item: "Pegar camisinha na UBS (é de graça) e perguntar sobre a PrEP." },
      { t: "Tem se sentido ansioso, triste ou bebendo mais do que queria?", need: "sim", item: "Conversar com a equipe sobre como você está se sentindo." },
      { t: "Suas vacinas estão em dia?", opts: ["Sim", "Não", "Não sei"], need: "nao-naosei", item: "Levar o cartão de vacina na UBS para atualizar." }
    ],
    "30-39": [
      { t: "Mediu a pressão no último ano?", need: "nao", item: "Medir a pressão. A pressão alta não dá sinal." },
      { t: "Tem pressão alta ou diabetes?", need: "sim", item: "Vir nos retornos e não parar o remédio por conta própria." },
      { t: "Você fuma?", need: "sim", item: "Pedir o apoio da UBS para parar de fumar. O tratamento é de graça." },
      { t: "Tem se sentido estressado, triste ou dormindo mal?", need: "sim", item: "Conversar com a equipe sobre como você está se sentindo." }
    ],
    "40-49": [
      { t: "Mediu a pressão e o açúcar no sangue no último ano?", need: "nao", item: "Medir a pressão e o açúcar no sangue (glicemia)." },
      { t: "Tem pressão alta ou diabetes?", need: "sim", item: "Vir nos retornos e não parar o remédio por conta própria." },
      { t: "Fuma ou bebe com frequência?", need: "sim", item: "Conversar na UBS sobre o cigarro e a bebida. Existe tratamento de graça." },
      { t: "Foi ao dentista no último ano?", need: "nao", item: "Marcar o dentista, principalmente se você fuma ou bebe." }
    ],
    "50-59": [
      { t: "Tem pressão alta ou diabetes?", need: "sim", item: "Vir nos retornos e não parar o remédio por conta própria." },
      { t: "Passou por uma consulta de rotina no último ano?", need: "nao", item: "Marcar uma consulta de rotina com o médico ou a enfermeira." },
      { t: "Fuma ou bebe com frequência?", need: "sim", item: "Conversar na UBS sobre o cigarro e a bebida. Existe tratamento de graça." },
      { t: "Suas vacinas estão em dia?", opts: ["Sim", "Não", "Não sei"], need: "nao-naosei", item: "Levar o cartão de vacina na UBS para atualizar." }
    ]
  };

  // O que manter mesmo quando está tudo em dia.
  var MANTER = {
    "20-29": ["Fazer teste rápido de HIV e sífilis uma vez por ano, ou depois de transar sem camisinha.", "Manter as vacinas em dia."],
    "30-39": ["Medir a pressão pelo menos uma vez por ano.", "Ir ao dentista uma vez por ano."],
    "40-49": ["Medir a pressão e o açúcar no sangue uma vez por ano.", "Ficar de olho nos sinais de alerta do xixi."],
    "50-59": ["Fazer uma consulta de rotina por ano.", "Ficar de olho nos sinais de alerta do xixi. O exame de PSA é para quem tem sintomas ou pai ou irmão com câncer de próstata."]
  };

  var FAIXA = { "20-29": "20 a 29 anos", "30-39": "30 a 39 anos", "40-49": "40 a 49 anos", "50-59": "50 a 59 anos" };
  var st = { step: "inicio", idade: null, alerta: null, resp: [] };
  var app = document.getElementById("app");

  function el(html) { app.innerHTML = html; window.scrollTo(0, 0); var f = app.querySelector("h1,h2"); if (f) { f.tabIndex = -1; f.focus({ preventScroll: true }); } }
  function total() { return 2 + (st.idade ? Q[st.idade].length : 4); }
  function bar(n) { var s = ""; for (var i = 0; i < total(); i++) s += '<i class="' + (i < n ? "on" : "") + '"></i>'; return '<div class="progress" aria-hidden="true">' + s + "</div>"; }
  function top(n) { return '<div class="qtop"><button class="link" data-go="back">‹ Voltar</button><span class="count">Pergunta ' + n + " de " + total() + "</span></div>" + bar(n); }

  function render() {
    if (st.step === "inicio") {
      el('<span class="tag">CS São Raimundo</span><h1>Check-up do Homem</h1>' +
        '<p class="lead">Responda algumas perguntas rápidas e veja o que você precisa cuidar na sua idade. Leva menos de 1 minuto.</p>' +
        '<div class="btns"><button class="btn main" data-go="idade">Começar</button></div>' +
        '<p class="small">Suas respostas não ficam guardadas.</p>');
    } else if (st.step === "idade") {
      el(top(1) + "<h2>Quantos anos você tem?</h2><div class=\"btns\">" +
        Object.keys(FAIXA).map(function (k) { return '<button class="btn" data-idade="' + k + '">' + FAIXA[k] + "</button>"; }).join("") +
        '<button class="btn alt" data-idade="fora">Menos de 20 ou mais de 59</button></div>');
    } else if (st.step === "fora") {
      el('<div class="qtop"><button class="link" data-go="back">‹ Voltar</button></div>' +
        '<h2>Este check-up é para homens de 20 a 59 anos</h2><p class="lead">Mesmo assim, a UBS cuida de você em qualquer idade. Fale com seu agente de saúde ou passe na unidade.</p>' +
        '<div class="btns"><button class="btn main" data-go="inicio">Voltar ao início</button></div>');
    } else if (st.step === "alerta") {
      el(top(2) + "<h2>Você tem algum destes?</h2><ul class=\"signs\">" + SINAIS.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ul>" +
        '<div class="row"><button class="btn" data-alerta="1">Sim</button><button class="btn" data-alerta="0">Não</button></div>');
    } else if (typeof st.step === "number") {
      var q = Q[st.idade][st.step], opts = q.opts || ["Sim", "Não"];
      el(top(3 + st.step) + "<h2>" + q.t + "</h2>" +
        (opts.length === 2 ? '<div class="row">' : '<div class="btns">') +
        opts.map(function (o) { return '<button class="btn" data-resp="' + o + '">' + o + "</button>"; }).join("") + "</div>");
    } else if (st.step === "resultado") {
      resultado();
    }
  }

  function precisa(q, r) {
    if (q.need === "sim") return r === "Sim";
    if (q.need === "nao") return r === "Não";
    return r !== "Sim";
  }

  function resultado() {
    var qs = Q[st.idade], itens = [];
    qs.forEach(function (q, i) { if (precisa(q, st.resp[i])) itens.push(q.item); });
    var cor, titulo, texto, pill;
    if (st.alerta) {
      cor = "red"; pill = "Atenção"; titulo = "Procure a UBS esta semana";
      texto = "Você marcou um sinal que precisa ser avaliado. Não espere passar: a equipe vai te atender e marcar sua consulta.";
    } else if (itens.length) {
      cor = "amber"; pill = "Check-up"; titulo = "Venha fazer seu check-up";
      texto = "Você não tem sinal de alerta, mas tem cuidados para colocar em dia.";
    } else {
      cor = "green"; pill = "Em dia"; titulo = "Parabéns, você está se cuidando";
      texto = "Continue assim. Veja o que manter na sua idade.";
    }
    var lista = itens.length ? itens : MANTER[st.idade];
    var tituloLista = itens.length ? "O que você precisa" : "Para continuar em dia";

    var msg = "Oi! Fiz o Check-up do Homem.\n\nIdade: " + FAIXA[st.idade] + "\nResultado: " + titulo +
      (st.alerta ? "\nMarquei um sinal de alerta." : "") +
      (itens.length ? "\n\nPreciso de:\n" + itens.map(function (t) { return "• " + t; }).join("\n") : "") +
      "\n\nPode marcar um horário pra mim na UBS?";

    el('<div class="result ' + cor + '"><span class="pill">' + pill + "</span><h2>" + titulo + "</h2><p>" + texto + "</p></div>" +
      '<div class="todo"><h3>' + tituloLista + "</h3><ul>" + lista.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul></div>" +
      '<a class="zap" href="https://wa.me/?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-zap"/></svg>Mandar para meu agente de saúde</a>' +
      '<p class="small">Escolha o contato do seu agente de saúde no WhatsApp. Atendimento na UBS é de graça.</p>' +
      '<div class="btns"><button class="btn alt" data-go="inicio">Refazer</button></div>');
  }

  function back() {
    if (st.step === "idade") st.step = "inicio";
    else if (st.step === "fora" || st.step === "alerta") st.step = "idade";
    else if (st.step === 0) st.step = "alerta";
    else if (typeof st.step === "number") st.step = st.step - 1;
    render();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.go === "back") return back();
    if (b.dataset.go === "inicio") { st = { step: "inicio", idade: null, alerta: null, resp: [] }; return render(); }
    if (b.dataset.go === "idade") { st.step = "idade"; return render(); }
    if (b.dataset.idade) {
      if (b.dataset.idade === "fora") { st.step = "fora"; return render(); }
      st.idade = b.dataset.idade; st.resp = []; st.step = "alerta"; return render();
    }
    if (b.dataset.alerta) { st.alerta = b.dataset.alerta === "1"; st.step = 0; return render(); }
    if (b.dataset.resp) {
      st.resp[st.step] = b.dataset.resp;
      st.step = st.step + 1 < Q[st.idade].length ? st.step + 1 : "resultado";
      return render();
    }
  });

  render();
})();
</script>
</body>
</html>
